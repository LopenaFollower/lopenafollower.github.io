		<style>

				display:flex;
			}

	"koksgalaxy":"4b2o$3b4o$2bob2ob2obo$7b2o2bo$2b2o2b2o2b3o$2b4obo2b3o$bo2bo3bo2bo$3o2bob4o$3o2b2o2b2o$bo2b2o$2bob2ob2obo$6b4o$7b2o",
	"30P5H2V0":"4bo$3b3o$2b2ob2o$$bobobobo2bo$2o3bo3b3o$2o3bo6bo$10bobo$8bobo$9bo2bo$12bo",
	"copperhead":"b2o2b2o$3b2o$3b2o$obo2bobo$o6bo$$o6bo$b2o2b2o$2b4o$$3b2o$3b2o",
	"mosquito":"b4o$o3bo$4bo$3bo3$bo$2bo$2bo$b2o$o4$b4o$o3bo$4bo$3bo",
	"blocklayingswitchenginepredecessor":"11bobo2b$2o8bo5b$2o9bo2bob$13b3o",
	"14911M":"8ob5o3b3o6b7ob5o",
}
function getPatternDim(t){
	let x=0,y=0,w=0,n=0;
	for(const c of t)
		if(+c>=0)n=+c+n*10;
		else{
			if(c=="$")y+=n||1,x=0;else w=Math.max(w,x+=n||1);
			n=0;
		}
	return{width:w,height:y+1};
}
function loadPattern(name,ox,oy){
	const txt=(patterns[name]||name).replace(/[^\dbo$]/g,""),{width,height}=getPatternDim(txt);
	if(!width)return;if(width>size||height>size)return alert(`Pattern out of bounds. {${width},${height}}`);
	console.log(`Loaded Size {${width},${height}}`)
	if(isNaN(ox)){
		ox=size-width>>1;
		oy=size-height>>1;
	}
	const grid=new Uint32Array(wordCount);
	let x=0,y=0,n=0;gens=0;
	for(const c of txt)
		if(+c>=0)n=+c+n*10;
		else{
			if(c=="$")y+=n||1,x=0;else for(let j=n||1;j>0;j--){
				const px=ox+x++,py=y+oy;
				c=="o"&&(grid[py*wordsPerRow+(px>>>5)]|=1<<(px&31));
			}
			n=0;
		}
	device.queue.writeBuffer(gridA,0,grid);
	device.queue.writeBuffer(gridB,0,grid);
}
function populate(){
	const grid=new Uint32Array(wordCount);
	for(let i=gens=0;i<wordCount;i++)grid[i]=(Math.random()*0x100000000)>>>0;
	device.queue.writeBuffer(useA?gridA:gridB,0,grid);
}
async function initGPU(){
	if(!navigator.gpu)throw"WebGPU is not supported.";
	const adapter=await navigator.gpu.requestAdapter();
	if(!adapter)throw"No GPU adapter found.";
	device=await adapter.requestDevice();
	format=navigator.gpu.getPreferredCanvasFormat();
	ctx=cvs.getContext("webgpu");
	ctx.configure({device,format,alphaMode:"opaque"});
	rebuildGPU(size);
}
function rebuildGPU(newSize){
	cvs.width=cvs.height=setSize(newSize);
	paramsBuf?.destroy();
	renderBuf?.destroy();
	editBuf?.destroy();
	viewBuf?.destroy();
	gridA?.destroy();
	gridB?.destroy();
	paramsBuf=device.createBuffer({size:8,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
	renderBuf=device.createBuffer({size:32,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
	editBuf=device.createBuffer({size:16,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
	viewBuf=device.createBuffer({size:16,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
	gridA=device.createBuffer({size:wordCount<<2,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});
	gridB=device.createBuffer({size:wordCount<<2,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});
	createPipelines();
	createEditPipeline();
	createRenderPipeline();
	resetSimulation();
}
const computeShader=`
struct Params{size:u32,wrap:u32}
@group(0)@binding(0)var<storage,read>grid:array<u32>;
@group(0)@binding(1)var<storage,read_write>next:array<u32>;
@group(0)@binding(2)var<uniform>p:Params;
@compute@workgroup_size(8,8)
fn main(@builtin(global_invocation_id)id:vec3u){
	let w=id.x;
	let y=id.y;
	let words=p.size>>5u;
	if(w>=words||y>=p.size){return;}
	let row=y*words;
	let i=row+w;
	let cur=grid[i];
	var ym1=y;
	var yp1=y;
	//00 01 02
	//10 11 12
	//20 21 22
	var p01=0u;
	var p21=0u;
	if(p.wrap==1u){
		ym1=select(y-1u,p.size-1u,y==0u);
		yp1=select(y+1u,0,y==p.size-1u);
		p01=grid[ym1*words+w];
		p21=grid[yp1*words+w];
	}else{
		if(y>0u){
			ym1=y-1u;
			p01=grid[ym1*words+w];
		}
		if(y+1u<p.size){
			yp1=y+1u;
			p21=grid[yp1*words+w];
		}
	}
	var p00=p01<<1u;
	var p02=p01>>1u;
	var p10=cur<<1u;
	var p12=cur>>1u;
	var p20=p21<<1u;
	var p22=p21>>1u;
	if(p.wrap==1u||w>0u){
		let prevW=select(w-1u,words-1u,w==0u);
		p00|=grid[ym1*words+prevW]>>31u;
		p10|=grid[row+prevW]>>31u;
		p20|=grid[yp1*words+prevW]>>31u;
	}
	if(p.wrap==1u||w+1u<words){
		let nextW=select(w+1u,0u,w+1u==words);
		p02|=grid[ym1*words+nextW]<<31u;
		p12|=grid[row+nextW]<<31u;
		p22|=grid[yp1*words+nextW]<<31u;
	}
	var n0=0u;
	var n1=0u;
	var n2=0u;
	var c:u32;
	var c2:u32;
	c=n0&p00;n0^=p00;c2=n1&c;n1^=c;n2^=c2;

	c=n0&p01; n0^=p01; c2=n1&c;n1^=c;n2^=c2;

	c=n0&p02;n0^=p02;c2=n1&c;n1^=c;n2^=c2;

	c=n0&p10;  n0^=p10;  c2=n1&c;n1^=c;n2^=c2;

	c=n0&p12;  n0^=p12;  c2=n1&c;n1^=c;n2^=c2;

	c=n0&p20;n0^=p20;c2=n1&c;n1^=c;n2^=c2;

	c=n0&p21; n0^=p21; c2=n1&c;n1^=c;n2^=c2;

	c=n0&p22;n0^=p22;c2=n1&c;n1^=c;n2^=c2;

	next[i]=(cur&~n2&n1&~n0)|(~n2&n1&n0);
}`,editShader=`
struct Edit{index:u32,mask:u32,val:u32}
@group(0)@binding(0)var<storage,read_write>grid:array<u32>;
@group(0)@binding(1)var<uniform>edit:Edit;
@compute@workgroup_size(1)
fn main(){
	let old=grid[edit.index];
	grid[edit.index]=select(old&~edit.mask,old|edit.mask,edit.val==1u);
}`,renderShader=`
struct Params{size:u32,wrap:u32}
struct Colors{a:vec4f,d:vec4f}
struct View{x:f32,y:f32,zoom:f32}
struct Out{@builtin(position)pos:vec4f}
@group(0)@binding(0)var<storage,read>grid:array<u32>;
@group(0)@binding(1)var<uniform>p:Params;
@group(0)@binding(2)var<uniform>c:Colors;
@group(0)@binding(3)var<uniform>v:View;
@vertex
fn v_main(@builtin(vertex_index)i:u32)->Out{
	var out:Out;
	out.pos=vec4f(array<vec2f,3>(vec2f(-1,-1),vec2f(3,-1),vec2f(-1,3))[i],0,1);
	return out;
}
@fragment
fn f_main(@builtin(position)pos:vec4f)->@location(0)vec4f{
	let x=u32(v.x+pos.x/v.zoom);
	let y=u32(v.y+pos.y/v.zoom);
	let words=p.size>>5u;
	let wordX=x>>5u;
	let bitX=x&31u;
	let word=grid[y*words+wordX];
	return select(c.a,c.d,(word&(1u<<bitX))==0u);
}`;
function hexToRGBA(hex){
	const n=parseInt(hex.slice(1),16);
	return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255,1];
}
function resetSimulation(){
	gens=0;
	const x=new Uint32Array(wordCount);
	device.queue.writeBuffer(gridA,0,x);
	device.queue.writeBuffer(gridB,0,x);
	useA=true;
}
function updateParams(){
	device.queue.writeBuffer(paramsBuf,0,new Uint32Array([size,useWrap.checked?1:0]));
	device.queue.writeBuffer(renderBuf,0,new Float32Array([...hexToRGBA(aliveColor.value),...hexToRGBA(deadColor.value)]));
	device.queue.writeBuffer(viewBuf,0,new Float32Array([viewX,viewY,zoom]));
}
function createPipelines(){
	const shader=device.createShaderModule({code:computeShader});
	computePipeline=device.createComputePipeline({layout:"auto",compute:{module:shader,entryPoint:"main"}});
	computeBindA=device.createBindGroup({layout:computePipeline.getBindGroupLayout(0),
		entries:[
			{binding:0,resource:{buffer:gridA}},
			{binding:1,resource:{buffer:gridB}},
			{binding:2,resource:{buffer:paramsBuf}}
		]
	});
	computeBindB=device.createBindGroup({
		layout:computePipeline.getBindGroupLayout(0),
		entries:[
			{binding:0,resource:{buffer:gridB}},
			{binding:1,resource:{buffer:gridA}},
			{binding:2,resource:{buffer:paramsBuf}}
		]
	});
}
function createEditPipeline(){
	const shader=device.createShaderModule({code:editShader});
	editPipeline=device.createComputePipeline({layout:"auto",compute:{module:shader,entryPoint:"main"}});
	editBindA=device.createBindGroup({
		layout:editPipeline.getBindGroupLayout(0),
		entries:[
			{binding:0,resource:{buffer:gridA}},
			{binding:1,resource:{buffer:editBuf}}
		]
	});
	editBindB=device.createBindGroup({
		layout:editPipeline.getBindGroupLayout(0),
		entries:[
			{binding:0,resource:{buffer:gridB}},
			{binding:1,resource:{buffer:editBuf}}
		]
	});
}
function createRenderPipeline(){
	const shader=device.createShaderModule({code:renderShader});
	renderPipeline=device.createRenderPipeline({layout:"auto",vertex:{module:shader,entryPoint:"v_main"},fragment:{module:shader,entryPoint:"f_main",targets:[{format}]},primitive:{topology:"triangle-list"}});
	renderBindA=device.createBindGroup({
		layout:renderPipeline.getBindGroupLayout(0),
		entries:[
			{binding:0,resource:{buffer:gridA}},
			{binding:1,resource:{buffer:paramsBuf}},
			{binding:2,resource:{buffer:renderBuf}},
			{binding:3,resource:{buffer:viewBuf}}
		]
	});
	renderBindB=device.createBindGroup({
		layout:renderPipeline.getBindGroupLayout(0),
		entries:[
			{binding:0,resource:{buffer:gridB}},
			{binding:1,resource:{buffer:paramsBuf}},
			{binding:2,resource:{buffer:renderBuf}},
			{binding:3,resource:{buffer:viewBuf}}
		]
	});
}
function encodeCompute(encoder,steps){
	for(let i=0;i<steps;gens++,i++){
		const pass=encoder.beginComputePass();
		pass.setPipeline(computePipeline);
		pass.setBindGroup(0,useA?computeBindA:computeBindB);
		pass.dispatchWorkgroups(Math.ceil(wordsPerRow/8),Math.ceil(size/8));
		pass.end();
		useA=!useA;
	}
}
function render(encoder){
	const view=ctx.getCurrentTexture().createView();
	const pass=encoder.beginRenderPass({colorAttachments:[{view,clearValue:{r:0,g:0,b:0,a:1},loadOp:"clear",storeOp:"store"}]});
	pass.setPipeline(renderPipeline);
	pass.setBindGroup(0,useA?renderBindA:renderBindB);
	pass.draw(3);
	pass.end();
}
function loop(){
	requestAnimationFrame(loop);
	if(!device)return;
	updateParams();
	const encoder=device.createCommandEncoder();
	if(toggle.checked&&!drawing)encodeCompute(encoder,gensPerFrame.valueAsNumber);
	render(encoder);
	device.queue.submit([encoder.finish()]);
	genDisp.innerText=gens.toLocaleString()+" Generations";
}
function editCell(e,v,ox=0,oy=0){
	const rect=cvs.getBoundingClientRect();
	const x=(viewX+(e.clientX-rect.left)*cvs.width/rect.width/zoom+ox)|0,y=(viewY+(e.clientY-rect.top)*cvs.height/rect.height/zoom+oy)|0;
	if(x<0||x>=size||y<0||y>=size)return;
	const index=y*wordsPerRow+(x>>>5);
	const mask=1<<(x&31);
	device.queue.writeBuffer(editBuf,0,new Uint32Array([index,mask>>>0,v,0]));
	const encoder=device.createCommandEncoder();
	const pass=encoder.beginComputePass();
	pass.setPipeline(editPipeline);
	pass.setBindGroup(0,useA?editBindA:editBindB);
	pass.dispatchWorkgroups(1);
	pass.end();
	device.queue.submit([encoder.finish()]);
}
function drawCells(e){
	if(drawMode.value!="Brush")editCell(e,drawVal);
	else for(let a=0;a<2*Math.PI;a+=Math.PI/16)if(Math.random()>.9)editCell(e,drawVal,Math.cos(a)*Math.random()*5,Math.sin(a)*Math.random()*5);
}
cvs.addEventListener("mousedown",e=>{
	e.preventDefault();
	if(e.button==1){
		panning=true;
		panX=e.clientX;
		panY=e.clientY;
	}else{
		if(!e.button)drawVal=1;else if(e.button===2)drawVal=0;else return;
		drawing=drawMode.value!="Off";
		if(drawing)drawCells(e);
	}
});
cvs.addEventListener("mousemove",e=>{
	if(drawing&&drawMode.value!="Click")drawCells(e);
	if(!panning)return;
	viewX-=(e.clientX-panX)/zoom;
	viewY-=(e.clientY-panY)/zoom;
	panX=e.clientX;
	panY=e.clientY;
	clampView();
});
function clampView(){
    viewX=Math.max(0,Math.min(size-size/zoom,viewX));
    viewY=Math.max(0,Math.min(size-size/zoom,viewY));
}
cvs.addEventListener("wheel",e=>{
	e.preventDefault();
	const rect=cvs.getBoundingClientRect();
	const mx=e.clientX-rect.left,my=e.clientY-rect.top;
	const ozoom=zoom;
	zoom*=Math.pow(1.1,-e.deltaY/100);
	zoom=Math.max(1,Math.min(64,zoom));
	viewX=viewX+mx/ozoom-mx/zoom;
	viewY=viewY+my/ozoom-my/zoom;
	clampView();
},{passive:false});
addEventListener("mouseup",e=>panning=drawing=false);
cvs.addEventListener("mouseleave",e=>panning=drawing=false);
cvs.addEventListener("contextmenu",e=>e.preventDefault());
Object.keys(patterns).forEach(e=>{
	const opt=document.createElement("option");
	selectset.appendChild(opt);
	opt.innerText=e;
});
stepBtn.onclick=()=>{
	if(!device)return;
	const encoder=device.createCommandEncoder();
	encodeCompute(encoder,1);
	render(encoder);
	device.queue.submit([encoder.finish()]);
}
(async()=>{
	await initGPU();
	loop();
})();
		</script>
